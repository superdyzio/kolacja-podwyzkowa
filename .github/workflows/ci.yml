name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npx astro check
      - name: Unit tests (DB integration tests skip without a local Supabase)
        run: npm test
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Supabase CLI comes from devDependencies (version pinned by package-lock.json), same as local development.
      - name: Start local Supabase (database, REST and gateway only)
        run: npx supabase start -x gotrue,realtime,storage-api,imgproxy,studio,postgres-meta,mailpit,edge-runtime,logflare,vector,supavisor
      - name: Write local Supabase credentials to .env
        run: npm run env:local
      - name: Unit and DB integration tests
        run: npm test
      - run: npm run build
      # One throwaway RETENTION_TOKEN for this job's preview AND smoke (the next step's two commands get it through $GITHUB_ENV), so
      # smoke section 46 runs the daily clean-up's positive path (the dryRun self-check and the real run) instead of
      # printing SKIP. Not a secret: it only opens the route of this job's local, throwaway server and database.
      - name: Generate a throwaway RETENTION_TOKEN for the preview and the smoke
        run: echo "RETENTION_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      # The smoke creates its own two restaurants and events in the local database from .env (the tests above leave
      # theirs behind; no empty database needed) and refuses any non-local SUPABASE_URL.
      - name: Run the access smoke test against the production preview
        run: |
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          BASE_URL=http://localhost:4321 npm run smoke
      - if: always()
        run: npx supabase stop --no-backup
